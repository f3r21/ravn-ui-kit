name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # What is locked across this repo and the consuming app is the **Node version**,
      # not these action majors. Node decides the bytes `npm run build` produces, which
      # is why it is pinned in `.nvmrc` and why the committed `dist/` freshness check
      # below only means anything if both pipelines agree on it.
      #
      # These `actions/*` majors are a different thing: they govern the runner-side JS
      # runtime of the action wrapper, not the toolchain that builds the code. Holding
      # them identical across the two repositories buys nothing the Node pin does not
      # already buy, and it costs currency — an older major is the real risk, not a
      # difference between the two. Both repositories let them float to current via
      # Dependabot's `github-actions` ecosystem instead (`.github/dependabot.yml`).
      #
      # Consistent with the SHA-pinning rule further down, which is this same rule read
      # the other way round: what is placed under control there is privilege, not
      # version. Only the two actions on the Pages publish path are pinned to full
      # commit SHAs. These two are not, on purpose — an outdated major is the live risk
      # for them, and a pin is the wrong instrument for that.
      #
      # Note they are currently three majors behind (`@v7` is current for both) — that
      # is the gap Dependabot is expected to close, not a pin to preserve.
      - name: Checkout
        uses: actions/checkout@v4

      # Kept in step with `.nvmrc` and with the consuming app, which runs 22 and
      # declares `engines.node: >=22.13.0`. One version across both repos is a
      # precondition for verifying a committed `dist/` — a freshness check run on
      # two different majors can disagree about a build that is in fact fine.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # One command rather than four steps, so CI and a developer's pre-commit
      # check cannot drift apart: `gate` is typecheck -> lint -> format:check ->
      # coverage, and it is what CONTRIBUTING.md tells you to run.
      - name: Gate
        run: npm run gate

      - name: Build library
        run: npm run build

      - name: Build Storybook
        run: npm run build:storybook

      # Chromium is not on the runner image, and `@storybook/test-runner` will not fetch it
      # for you — it fails at launch instead. `--with-deps` pulls the shared libraries the
      # headless browser needs, which a dev machine already has and a fresh runner does not.
      # Chromium only: the accessibility findings this gates on are engine-independent, and
      # three browsers would triple the step for no additional signal.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The gate above never renders a component. `src/styles/contrast.test.ts` checks
      # tokens against each other and the unit suite runs in jsdom, so a component that
      # composes two individually-fine tokens into a failing pair passes both. This serves
      # the Storybook built in the previous step and runs axe over all 144 stories in a real
      # browser, failing on any finding not recorded in `.storybook/a11y-allowlist.ts`.
      #
      # If this step reports every story as failing, read the first message rather than the
      # count: a runner that cannot reach the served Storybook fails the same way a genuine
      # wall of violations does, and the runner says which it is.
      - name: Accessibility (axe over every story)
        run: npm run test:a11y:ci

      # Uploaded in the shape `actions/deploy-pages` consumes, rather than as a
      # plain artifact. The build already happened above; publishing it is the
      # only step that was missing, and without it the README's opening line —
      # go and look at the Storybook — pointed at nothing a reader could open.
      #
      # ── Why this one is SHA-pinned, and `checkout`/`setup-node` above are not ──
      #
      # One rule, not two calls: what is placed under control here is **privilege, not
      # version**. This step and `deploy-pages` in the job below are the two halves of
      # the Pages publish path, which is the only privileged thing this workflow does —
      # that job is the sole holder of `pages: write` + `id-token: write`, and this step
      # decides the bytes it publishes. Pinning only the half holding the token would be
      # theatre: a moved tag *here* lands arbitrary content on the public site through
      # the privileged job downstream, without ever needing the scopes itself. Both
      # halves or neither.
      #
      # `actions/checkout` and `actions/setup-node` stay on floating majors under the
      # same rule: they hold no write scope, they govern the runner-side JS runtime of
      # the action wrapper rather than the toolchain that builds the code, and for them
      # an outdated major is the live risk — so they are expected to keep moving via the
      # `github-actions` Dependabot ecosystem (`.github/dependabot.yml`). Pinning the two
      # below costs nothing in currency, because Dependabot updates SHA pins and their
      # trailing version comment too. Both actions already have a v5 and are expected to
      # arrive that way: the pin records what runs today, it does not hold a version back.
      - name: Package Storybook for Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: storybook-static

      # audit-level=high: repo has one known, accepted moderate vuln (uuid via
      # @storybook/addon-essentials -> @storybook/addon-actions). Fixing it
      # requires downgrading @storybook/addon-essentials to 7.0.6 (a breaking
      # Storybook change), tracked separately — not fixed here. This level
      # still fails CI on any new high/critical vulnerability.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  # Publishing is its own job so the gate stays the thing that decides whether
  # anything ships: `needs: ci` means a red typecheck, lint, test or audit run
  # leaves the published Storybook at its last good state rather than replacing
  # it with a broken one.
  deploy-storybook:
    name: Publish Storybook
    needs: ci
    # Pull requests build the Storybook and stop there. Only `main` publishes —
    # there is one Pages site per repository, so deploying from a branch would
    # mean every open PR overwriting the documented URL in turn.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Narrower than the default and wider than the workflow's `contents: read`:
    # `pages: write` to publish, and `id-token: write` because `deploy-pages`
    # authenticates to the Pages service with an OIDC token rather than a
    # long-lived secret.
    permissions:
      pages: write
      id-token: write

    # Two concurrent publishes would race to be the live version, so these queue
    # instead of cancelling — unlike the CI runs above, where a superseded run
    # has nothing worth finishing.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # SHA-pinned under the rule stated in full at `upload-pages-artifact` in the `ci`
      # job above — privilege, not version. This is the half of the Pages publish path
      # that holds the scopes: `pages: write` and `id-token: write`, declared directly
      # above and granted nowhere else in this workflow. It is therefore the one place
      # in the repository where a moved tag buys an attacker something real, namely an
      # OIDC-authenticated publish to the live documentation site.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
